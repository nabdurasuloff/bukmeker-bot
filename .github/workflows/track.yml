name: Kunlik prognoz va natijalar

on:
  schedule:
    - cron: "37 7 * * *"   # har kuni 12:37 (Toshkent)
  workflow_dispatch:

permissions:
  contents: write

concurrency: track

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Prognozlarni yozish va natijalarni tekshirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scripts/track.py
      - name: Natijalarni saqlash
        run: |
          git config user.name "bukmeker-bot"
          git config user.email "bukmeker-bot@users.noreply.github.com"
          git add data/predictions.json api/_stats.py
          git diff --cached --quiet && echo "O'zgarish yo'q" || (git commit -m "Kunlik prognoz/natija yangilanishi" && git push)
