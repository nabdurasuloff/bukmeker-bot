name: Kunlik prognoz va natijalar

on:
  schedule:
    - cron: "37 7 * * *"   # har kuni 12:37 (Toshkent) — prognoz, natija, hisobot
    - cron: "10 * * * *"   # har soat — signal berilgan o'yinlarning yopilish narxi (CLV); kerak bo'lmasa kredit sarflamaydi
  workflow_dispatch:

permissions:
  contents: write

concurrency: track

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MY_BOOKIES: ${{ secrets.MY_BOOKIES }}
        run: |
          if [ "${{ github.event.schedule }}" != "10 * * * *" ]; then python scripts/elo_build.py; fi
          python scripts/track.py ${{ github.event.schedule == '10 * * * *' && 'closing' || 'daily' }}
      - name: Natijalarni saqlash
        run: |
          git config user.name "bukmeker-bot"
          git config user.email "bukmeker-bot@users.noreply.github.com"
          git add data/predictions.json data/jackpots.json api/_stats.py api/_elo.py
          git diff --cached --quiet && echo "O'zgarish yo'q" || (git commit -m "Prognoz/natija yangilanishi" && git pull --rebase -q && git push)
